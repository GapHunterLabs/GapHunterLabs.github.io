<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gap Hunter Labs — social share preview</title>
<style>
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("fonts/IBMPlexSans-Variable.ttf") format("truetype");
    font-weight: 100 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/JetBrainsMono-Variable.ttf") format("truetype");
    font-weight: 100 800;
    font-style: normal;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #090D16;
    font-family: "IBM Plex Sans", sans-serif;
    overflow: hidden;
    position: relative;
    color: #E9EDF8;
  }
  /* Same faint dot-grid texture as the live site. */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #29334A 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.35;
  }
  .wash {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 900px 480px at 28% 0%, rgba(63,162,255,0.10), transparent 62%);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid #3FA2FF;
    opacity: 0.6;
  }
  .corner.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .corner.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

  .frame {
    position: relative;
    height: 630px;
    padding: 64px 64px 56px;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    column-gap: 48px;
    align-items: stretch;
  }

  .copy {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .brand-logo {
    width: 64px;
    height: 74px;
    display: block;
    flex: none;
  }
  .brand-name {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 42%, #3FA2FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .headline {
    margin-top: 36px;
    font-size: 52px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.03em;
  }
  .headline .line2 {
    background: linear-gradient(90deg, #3FA2FF, #01B3FD);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subhead {
    margin-top: 22px;
    max-width: 560px;
    font-size: 22px;
    line-height: 1.45;
    color: #9AA6C4;
  }

  .badges {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 22px 26px;
    align-items: center;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #FFFFFF;
  }
  .badge .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #34D5C7;
  }
  .badge svg {
    width: 20px;
    height: 20px;
    flex: none;
  }
  .jb-icon {
    border-radius: 4px;
    background: linear-gradient(135deg, #FF318C, #FF6E00);
  }

  /* Tiles re-hechos 2026-09-10 para calzar con el rediseño "Intelligence
     Cockpit" real -- .category-links .cat-cell en index.html YA NO usa
     la barra de acento izquierda (::before), pasó a un ícono en badge
     redondeado con fondo/borde teñidos del color de categoría. Valores
     (padding, radios, color-mix%) copiados tal cual de index.html para
     que este preview no quede desincronizado del sitio real de nuevo. */
  .tiles {
    align-self: center;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .tile {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 108px;
    padding: 18px 20px;
    background: #111726;
    border: 1px solid #29334A;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
  }
  .tile-icon {
    flex: none;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    color: var(--cat);
    background: color-mix(in srgb, var(--cat) 14%, #212C45);
    border: 1px solid color-mix(in srgb, var(--cat) 40%, #29334A);
    border-radius: 12px;
  }
  .tile-icon svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
  }
  .tile-copy { display: grid; gap: 3px; }
  .tile-label {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .tile-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    color: #9AA6C4;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="corner tl"></div>
  <div class="corner br"></div>

          JetBrains Marketplace
        </div>

          GitHub

      </div>
    </div>

    <div class="tiles" aria-hidden="true">
      <div class="tile">

  </div>
</body>
</html>
