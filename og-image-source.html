<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #090D16;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* faint dot grid, same texture as the existing og-image.png */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #29334A 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.35;
  }
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid #3FA2FF;
    opacity: 0.6;
  }
  .corner.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .corner.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

  .eyebrow {
    position: absolute;
    top: 60px;
    right: 64px;
    text-align: right;
  }
  .eyebrow .label {
    font-size: 13px;
    letter-spacing: 3px;
    color: #8894B8;
    font-family: "Consolas", "Courier New", monospace;
  }
  .eyebrow .rule {
    margin-top: 8px;
    height: 1px;
    width: 180px;
    background: linear-gradient(90deg, transparent, #3FA2FF);
    margin-left: auto;
  }

  .brand-row {
    position: absolute;
    top: 92px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .brand-row img {
    width: 84px;
    height: 84px;
    display: block;
  }
  .brand-row .brand-name {
    font-size: 44px;
    font-weight: 800;
    background: linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 40%, #3FA2FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
  }

  .headline {
    position: absolute;
    top: 258px;
    left: 64px;
    max-width: 660px;
  }
  .headline .line1 {
    font-size: 46px;
    font-weight: 800;
    color: #E9EDF8;
    line-height: 1.15;
  }
  .headline .line2 {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.15;
    background: linear-gradient(90deg, #3FA2FF, #01B3FD);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subhead {
    margin-top: 22px;
    font-size: 19px;
    color: #9AA6C4;
    line-height: 1.5;
    max-width: 560px;
  }

  .badges {
    position: absolute;
    bottom: 56px;
    left: 64px;
    display: flex;
    gap: 26px;
    align-items: center;
  }
  .badges .badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #8DACE0;
    font-family: "Consolas", "Courier New", monospace;
    letter-spacing: 0.5px;
  }
  .badges .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34D5C7;
  }
  .badges .gh-icon {
    width: 16px;
    height: 16px;
    fill: #8DACE0;
  }
  .badges .cat-icon {
    width: 16px;
    height: 16px;
  }
  .badges .jb-icon {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    background: linear-gradient(135deg, #FF318C, #FF6E00);
    padding: 1px;
  }

  /* network graph on the right, mirroring the existing og-image.png */
  .graph {
    position: absolute;
    top: 0;
    right: 0;
    width: 560px;
    height: 630px;
  }
  .graph svg { width: 100%; height: 100%; }
  .node-label {
    position: absolute;
    font-size: 12px;
    color: #E9EDF8;
    background: #111726;
    border: 1px solid #29334A;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: "Consolas", "Courier New", monospace;
    white-space: nowrap;
    transform: translate(-50%, 0);
  }
</style>
</head>
<body>
  <div class="corner tl"></div>
  <div class="corner br"></div>

  <div class="eyebrow">
    <div class="label">HUNTING FIELD</div>

  <div class="brand-row">

    <div class="line2">Catalog Report</div>

    every plugin exists because of a documented<br>need, not a guess.</div>

    </div>

        0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58

        1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0
        16 8c0-4.42-3.58-8-8-8z"/></svg>
      GITHUB OPEN SOURCE
    </div>
  </div>

  <div class="graph">

      <g stroke="#29334A" stroke-width="1" opacity="0.5">

</body>
</html>
