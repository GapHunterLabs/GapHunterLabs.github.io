<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #090D16;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* faint dot grid, same texture as the existing og-image.png */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #29334A 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.35;
  }
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid #3FA2FF;
    opacity: 0.6;
  }
  .corner.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .corner.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

  .brand-row {
    position: absolute;
    top: 92px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 23px;
  }
  .brand-row .brand-logo {
    width: 95px;
    height: 110px;
    display: block;
  }
  .brand-row .brand-name {
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 40%, #3FA2FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
  }

  .headline {
    position: absolute;
    top: 272px;
    left: 64px;
    max-width: 660px;
  }
  .headline .line1 {
    font-size: 58px;
    font-weight: 800;
    color: #E9EDF8;
    line-height: 1.15;
  }
  .headline .line2 {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.15;
    background: linear-gradient(90deg, #3FA2FF, #01B3FD);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subhead {
    margin-top: 22px;
    font-size: 23px;
    color: #9AA6C4;
    line-height: 1.5;
    max-width: 560px;
  }

  .badges {
    position: absolute;
    bottom: 56px;
    left: 64px;
    display: flex;
    gap: 26px;
    align-items: center;
  }
  .badges .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 19px;
    font-weight: 700;
    color: #FFFFFF;
    font-family: "Consolas", "Courier New", monospace;
    letter-spacing: 0.5px;
  }
  .badges .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #34D5C7;
  }
  .badges .gh-icon {
    width: 22px;
    height: 22px;
    fill: #FFFFFF;
  }
  .badges .cat-icon {
    width: 22px;
    height: 22px;
  }
  .badges .jb-icon {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: linear-gradient(135deg, #FF318C, #FF6E00);
    padding: 1px;
  }

  /* network graph on the right, mirroring the existing og-image.png */
  .graph {
    position: absolute;
    top: 0;
    right: 0;
    width: 560px;
    height: 630px;
  }
  .graph svg { width: 100%; height: 100%; }
  .node-label {
    position: absolute;
    font-size: 12px;
    color: #E9EDF8;
    background: #111726;
    border: 1px solid #29334A;
    border-radius: 4px;
    padding: 2px 8px;
    font-family: "Consolas", "Courier New", monospace;
    white-space: nowrap;
    transform: translate(-50%, 0);
  }
</style>
</head>
