name: Update VS Code catalog data

# Same twice-daily cadence as update-catalog.yml (05:00 and 22:00 UTC =
# midnight and 5pm America/Bogota, updated 2026-09-10), kept as its own
# workflow because it pulls from a different marketplace (VS Code, not
# JetBrains) into a different output file (data/vscode-catalog-data.json)
# with no shared consumer -- the JetBrains workflow's JSON-LD/no-script
# parity check has nothing to do with this data and should never gate
# on it, or vice versa.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-vscode-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Run auto-update
        run: python pipeline/auto_update_vscode_catalog.py

      # 2026-09-11: mismo cron que update-catalog.yml ("0 5 * * *" /
      # "0 22 * * *") -- los dos jobs pueden pushear a `main` casi al
      # mismo tiempo. Confirmado en vivo: este job commiteo primero (run
      # #47 de update-catalog.yml se rechazo por esto). Mismo fix ahi:
      # reintentar con fetch+rebase antes de rendirse (archivos 100%
      # generados, sin edicion manual con la que un rebase pueda chocar).
      - name: Commit and push if data changed
        run: |
          git config user.name "Gap Hunter Labs"
          git config user.email "gaphunterlabs@gmail.com"
          if git diff --quiet -- data/vscode-catalog-data.json; then
            echo "sin cambios reales en los datos, no se commitea nada"
            exit 0
          fi
          git add data/vscode-catalog-data.json
          git commit -m "Auto-update VS Code catalog data ($(date -u +%Y-%m-%d))"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rechazado (probable carrera con update-catalog.yml, intento $i/5) -- fetch+rebase y reintentar"
            sleep $(( (RANDOM % 10) + 5 ))
            git fetch origin main
            git rebase origin/main
          done
          echo "push fallo tras 5 intentos -- abortando" >&2
          exit 1
