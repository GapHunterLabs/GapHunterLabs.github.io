name: Update VS Code catalog data

# Same twice-daily cadence as update-catalog.yml (05:00 and 22:00 UTC =
# midnight and 5pm America/Bogota, updated 2026-09-10), kept as its own
# workflow because it pulls from a different marketplace (VS Code, not
# JetBrains) into a different output file (data/vscode-catalog-data.json)
# with no shared consumer -- the JetBrains workflow's JSON-LD/no-script
# parity check has nothing to do with this data and should never gate
# on it, or vice versa.
on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-vscode-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Run auto-update
        run: python pipeline/auto_update_vscode_catalog.py

      - name: Commit and push if data changed
        run: |
          git config user.name "Gap Hunter Labs"
          git config user.email "gaphunterlabs@gmail.com"
          if git diff --quiet -- data/vscode-catalog-data.json; then
            echo "sin cambios reales en los datos, no se commitea nada"
          else
            git add data/vscode-catalog-data.json
            git commit -m "Auto-update VS Code catalog data ($(date -u +%Y-%m-%d))"
            git push
          fi
