name: Update catalog data

# Corre diario a las 5:30am America/Bogota (UTC-5, sin DST) = 10:30 UTC.
# Trae datos EN VIVO de JetBrains Marketplace + GitHub (descargas,
# pricing, reviews, rating, stars) para los 34 plugins y actualiza
# index.html solo -- sin intervencion manual. Los campos que casi
# nunca cambian (pitch/why/niche/xmlId) viven congelados en
# pipeline/catalog_static_metadata.json, no se re-generan aca; ver el
# comentario "_comment" de ese archivo para como regenerarlo a mano si
# alguna vez hace falta.
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch: {}  # permite disparar manualmente desde la pestaña Actions si hace falta

# Permiso minimo real que este job necesita, explicito a nivel top-level
# para que ningun job nuevo agregado despues herede accidentalmente algo
# mas amplio -- 'contents: write' es en si mismo el minimo indispensable
# (el ultimo paso hace push a este mismo repo), pero se declara aca en vez
# de dejarlo implicito (el default de un workflow sin este bloque es
# 'contents: write' + varios otros scopes de solo-lectura que este job
# nunca usa).
permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      # Pineadas por SHA de commit, no por tag mutable (v4/v5 son punteros
      # que el propio mantenedor de la action puede reapuntar a otro commit
      # sin que este workflow lo note) -- mismo principio de supply-chain
      # que gh actions-importer/step-security recomiendan. SHA real
      # confirmado contra el tag correspondiente el dia que se agrego este
      # pin; si algun dia hace falta actualizar la action, resolver el SHA
      # del nuevo tag primero, nunca pegar un SHA sin verificar de donde
      # salio.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Run auto-update (fetches live data, swaps index.html in place)
        run: python pipeline/auto_update_catalog.py

      - name: Commit and push if data changed
        run: |
          git config user.name "Gap Hunter Labs"
          git config user.email "gaphunterlabs@gmail.com"
          if git diff --quiet -- index.html pipeline/catalog_daily_history.json pipeline/catalog_latest_data.json; then
            echo "sin cambios reales en los datos, no se commitea nada"
          else
            git add index.html pipeline/catalog_daily_history.json pipeline/catalog_latest_data.json
            git commit -m "Auto-update catalog data ($(date -u +%Y-%m-%d))"
            git push
          fi
