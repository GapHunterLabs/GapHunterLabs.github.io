<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OG render source -- do not serve directly</title>
<style>
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("@@FONT_SANS@@") format("woff2");
    font-weight: 100 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("@@FONT_MONO@@") format("woff2");
    font-weight: 100 800;
    font-style: normal;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #090D16;
    font-family: "IBM Plex Sans", sans-serif;
    overflow: hidden;
    position: relative;
    color: #E9EDF8;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, #29334A 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.35;
  }
  .wash {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 900px 480px at 28% 0%, rgba(63,162,255,0.10), transparent 62%);
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 2px solid #3FA2FF;
    opacity: 0.6;
  }
  .corner.tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .corner.br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

  .frame {
    position: relative;
    height: 630px;
    padding: 64px 64px 56px;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
    column-gap: 48px;
    align-items: stretch;
  }

  .copy { display: flex; flex-direction: column; min-width: 0; }
  .brand-row { display: flex; align-items: center; gap: 16px; }
  .brand-logo { width: 48px; height: 55px; display: block; flex: none; }
  .brand-name {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #9AA6C4;
  }

  .headline {
    margin-top: 40px;
    font-size: @@NAME_FONT_SIZE@@px;
    font-weight: 700;
    line-height: 1.14;
    letter-spacing: -0.03em;
    background: linear-gradient(90deg, #FFFFFF 0%, #FFFFFF 55%, #3FA2FF 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .niche {
    margin-top: 14px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #3FA2FF;
  }
  .subhead {
    margin-top: 22px;
    max-width: 580px;
    font-size: 21px;
    line-height: 1.5;
    color: #9AA6C4;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .badges {
    margin-top: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 22px 26px;
    align-items: center;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #FFFFFF;
  }
  .badge .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: @@PRICING_DOT@@;
  }
  .badge svg { width: 20px; height: 20px; flex: none; }

  .side {
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .tile-big {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 26px 24px;
    background: #111726;
    border: 1px solid #29334A;
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
  }
  .tile-big-icon {
    flex: none;
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    color: var(--cat);
    background: color-mix(in srgb, var(--cat) 14%, #212C45);
    border: 1px solid color-mix(in srgb, var(--cat) 40%, #29334A);
    border-radius: 14px;
  }
  .tile-big-icon svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 1.5; }
  .tile-big-copy { display: grid; gap: 4px; min-width: 0; }
  .tile-big-label {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tile-big-sub {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    color: #9AA6C4;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .stat-row { display: flex; gap: 14px; }
  .stat-chip {
    flex: 1;
    padding: 16px 18px;
    background: #111726;
    border: 1px solid #29334A;
    border-radius: 12px;
    min-width: 0;
  }
  .stat-num {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 24px;
    font-weight: 700;
    color: #34D5C7;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stat-label {
    margin-top: 4px;
    font-size: 13px;
    color: #9AA6C4;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="corner tl"></div>
  <div class="corner br"></div>

  <div class="frame">
    <div class="copy">
      <div class="brand-row">
        <svg class="brand-logo" viewBox="172 81 675 782" aria-hidden="true">
          <path d="M 511,81 L 847,283 L 725,351 L 508,223 L 296,348 L 296,588 L 463,691 L 342,765 L 173,665 L 172,281 Z" fill="#0151FC"/>
          <path d="M 846,412 L 844,668 L 518,863 L 393,795 L 724,589 L 721,540 L 567,538 L 568,412 Z" fill="#01B3FD"/>
          <polygon points="569,413 695,413 695,539 569,539" fill="#02F172"/>
        </svg>
        <div class="brand-name">Gap Hunter Labs</div>
      </div>

      <div class="headline">@@NAME@@</div>
      <div class="niche">@@NICHE@@</div>
      <p class="subhead">@@TAGLINE@@</p>

      <div class="badges">
        <div class="badge"><span class="dot"></span>@@PRICING_LABEL@@</div>
        @@PLATFORM_BADGES@@
      </div>
    </div>

    <div class="side" aria-hidden="true">
      <div class="tile-big" style="--cat:@@CAT_COLOR@@">
        <span class="tile-big-icon"><svg viewBox="-8 -8 16 16">@@CAT_ICON@@</svg></span>
        <span class="tile-big-copy">
          <span class="tile-big-label">@@CAT_LABEL@@</span>
          <span class="tile-big-sub">Category</span>
        </span>
      </div>
      <div class="stat-row">
        <div class="stat-chip">
          <div class="stat-num">@@STAT1_VALUE@@</div>
          <div class="stat-label">@@STAT1_LABEL@@</div>
        </div>
        <div class="stat-chip">
          <div class="stat-num">@@STAT2_VALUE@@</div>
          <div class="stat-label">@@STAT2_LABEL@@</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
